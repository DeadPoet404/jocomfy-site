name: jocomfy-site

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  website:
    image: jocomfy-site:latest
    build:
      context: .
      args:
        NEXT_PUBLIC_SMS_API_URL: /api
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      SMS_BACKEND_URL: "http://backend:5000"
    networks:
      - sms-net
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging

networks:
  sms-net:
    external: true
    name: ${SMS_DOCKER_NETWORK:-school-management-system_sms-net}
